name: lab4-admin-db

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    # Share the oracle network namespace: inside this container
    # localhost:1521 is the database, the same address the host uses.
    network_mode: service:oracle
    environment:
      ORACLE_CONN: localhost:1521/${ORACLE_SERVICE:-FREEPDB1}
    depends_on:
      oracle:
        condition: service_healthy

  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23.26.4-slim-faststart}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
    # One volume per Oracle version: datafiles cannot be shared across versions.
    name: lab4-oracle-${ORACLE_VOLUME:-23}
